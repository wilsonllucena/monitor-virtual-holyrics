name: release

# Publica o instalador numa release. Quando a assinatura pela SignPath Foundation
# estiver aprovada e configurada, o mesmo fluxo passa a anexar o instalador ASSINADO.
#
# Para ativar a assinatura, defina no repositório:
#   Variables (Settings > Secrets and variables > Actions > Variables)
#     SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
#   Secrets
#     SIGNPATH_API_TOKEN
# Sem essas variáveis o fluxo continua funcionando e publica o instalador não assinado.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Solicitar assinatura à SignPath
        id: signpath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Baixar o instalador não assinado
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        uses: actions/download-artifact@v4
        with:
          name: instalador
          path: dist

      - name: Conferir o instalador
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Instalador não encontrado.' }

          $assinatura = Get-AuthenticodeSignature $exe.FullName
          $configurado = '${{ vars.SIGNPATH_ORGANIZATION_ID }}' -ne ''

          Write-Host "Arquivo   : $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"
          Write-Host "SignPath  : $(if ($configurado) { 'configurado' } else { 'não configurado' })"
          Write-Host "Assinatura: $($assinatura.Status)"
          if ($assinatura.SignerCertificate) {
            Write-Host "Assinante : $($assinatura.SignerCertificate.Subject)"
          }

          if ($configurado -and $assinatura.Status -ne 'Valid') {
            throw "SignPath está configurado, mas o instalador voltou sem assinatura válida ($($assinatura.Status))."
          }

          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Anexar à release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          Write-Host "Publicando na release $tag"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }

          gh release upload $tag '${{ steps.exe.outputs.path }}' --clobber

      - name: Aviso (execução manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          Write-Host "Execução manual: nada foi publicado."
          Write-Host "O instalador está nos artefatos desta execução."
          Write-Host "Para publicar de verdade, crie a tag: git tag v0.1.1 && git push origin v0.1.1"
